<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carnet d'Étude — Corps / Esprit</title>
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Fonts & OpenDyslexic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@300;400;600&family=Montserrat:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic.min.css">

  <style>
    :root {
      --corps: #8b2612;
      --esprit: #1b4332;
      --bg-paper: #f4f1ea;
      --ink-color: #2b2b2b;
      --cover-color: #3d2314;
      --shadow-color: rgba(0, 0, 0, 0.15);
      --font-hand: 'Caveat', cursive;
      --font-main: 'Newsreader', serif;
      --font-ui: 'Inter', sans-serif;
    }

    [data-theme="dark"] {
      --bg-paper: #1e1e24;
      --ink-color: #e0e0e0;
      --cover-color: #120c08;
      --shadow-color: rgba(0, 0, 0, 0.6);
    }

    /* Neutralisation CLS au chargement */
    body.no-anim * {
      transition: none !important;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: var(--ink-color);
      font-family: var(--font-main);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Conteneur fluide & centré */
    .book-scale-wrap {
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.1s ease-out;
    }

    .book-container {
      width: 840px;
      height: 595px;
      background-color: var(--bg-paper);
      display: flex;
      position: relative;
      box-shadow: 0 20px 50px var(--shadow-color);
      border-radius: 4px;
    }

    .page {
      width: 50%;
      height: 100%;
      padding: 30px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .spine {
      width: 4px;
      height: 100%;
      background: rgba(0, 0, 0, 0.15);
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    /* Module Enveloppe */
    .envelope-wrapper {
      position: absolute;
      bottom: 40px;
      left: 30px;
      width: 200px;
      height: 140px;
      cursor: pointer;
    }

    .envelope-body {
      width: 100%;
      height: 100%;
      background: #e6dfd3;
      border: 1px solid #c8bead;
      position: relative;
      border-radius: 4px;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-top: 70px solid #d8cebd;
      transform-origin: top;
      transition: transform 0.4s ease;
      z-index: 3;
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-letter {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: #fff;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.4s ease;
      z-index: 2;
    }

    .envelope-wrapper.open .envelope-letter {
      transform: translateY(-50px);
      z-index: 4;
    }

    .letter-text {
      font-family: var(--font-hand);
      font-size: 1.1rem;
      margin: 0;
    }

    /* Docks / Barres d'outils flottantes */
    .tools-dock {
      position: fixed;
      top: 15px;
      left: 15px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .tools-dock button, .public-toolbar button, .artist-dock button {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      padding: 8px 14px;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.2s;
    }

    .tools-dock button:hover, .public-toolbar button:hover, .artist-dock button:hover {
      background: rgba(255, 255, 255, 1);
    }

    .audience-badge {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: var(--font-ui);
      font-size: 0.8rem;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .public-toolbar, .artist-dock {
      position: fixed;
      bottom: 20px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .artist-dock {
      right: 20px;
      top: 60px;
      bottom: auto;
      flex-direction: column;
      border-radius: 12px;
    }

    .dock-title {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    /* Bottom sheet commentaires */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: var(--bg-paper);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
      padding: 20px;
      box-sizing: border-box;
      z-index: 200;
      transition: transform 0.3s ease;
    }

    .bottom-sheet.hidden {
      transform: translate(-50%, 100%);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .sheet-header h3 {
      margin: 0;
      font-family: var(--font-ui);
    }

    .comment-form {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .comment-form input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: var(--font-ui);
    }

    .comment-form button {
      padding: 10px 16px;
      background: var(--corps);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* Mode Accessibilité DYS */
    body.dyslexic-mode {
      font-family: 'OpenDyslexic', sans-serif !important;
    }
  </style>
</head>
<body class="no-anim">

  <!-- En-tête & Barre d'outils fixe -->
  <header class="tools-dock">
    <button id="theme-toggle" aria-label="Basculer le mode sombre">🌙 Thème</button>
    <button id="zoom-in" aria-label="Zoom avant">+</button>
    <button id="zoom-out" aria-label="Zoom arrière">-</button>
  </header>

  <!-- Jauge d'audience temps réel -->
  <div id="audience-counter" class="audience-badge" title="Visiteurs connectés en temps réel">
    🟢 <span id="online-count">1</span> en ligne
  </div>

  <!-- Zone de centrage & mise à l'échelle du carnet -->
  <main class="book-scale-wrap">
    <div id="book" class="book-container">
      
      <!-- Couverture Gauche -->
      <div class="cover cover-left"></div>

      <!-- Pliure / Reliure centrale -->
      <div class="spine"></div>

      <!-- Double-page active -->
      <div class="page page-left" id="page-left">
        <h2>Corps / Esprit</h2>
        <p>Étude sur la dualité et le mouvement intérieur.</p>

        <!-- Module Enveloppe Scrapbooking -->
        <div class="envelope-wrapper" id="envelope-module">
          <div class="envelope-body">
            <div class="envelope-flap"></div>
            <div class="envelope-letter" id="envelope-letter">
              <p class="letter-text">Bienvenue dans ce carnet d'étude interactif...</p>
            </div>
          </div>
        </div>
      </div>

      <div class="page page-right" id="page-right">
        <!-- Emplacement dynamique des contenus & post-it -->
      </div>

      <!-- Couverture Droite -->
      <div class="cover cover-right"></div>
    </div>
  </main>

  <!-- Dock Public (Visiteur) -->
  <nav class="public-toolbar">
    <button id="prev-page" aria-label="Page précédente">◀</button>
    <button id="add-postit-btn">➕ Post-it</button>
    <button id="open-comments-btn">💬 Commentaires</button>
    <button id="inclusive-mode-btn">👓 Mode DYS</button>
    <button id="next-page" aria-label="Page suivante">▶</button>
  </nav>

  <!-- Dock Artiste (Édition) - Masqué par défaut -->
  <aside id="artist-dock" class="artist-dock hidden">
    <div class="dock-title">Mode Artiste</div>
    <button id="add-page-btn">📄 Ajout Page</button>
    <button id="draw-tool-btn">✏️ Dessin</button>
    <button id="preview-mode-btn">👁️ Aperçu</button>
    <div id="layer-toolbar" class="layer-toolbar"></div>
  </aside>

  <!-- Volet des Commentaires -->
  <section id="comments-sheet" class="bottom-sheet hidden">
    <div class="sheet-header">
      <h3>Fil de discussion</h3>
      <button id="close-comments-btn">✖</button>
    </div>
    <div id="comments-list" class="comments-list"></div>
    <form id="comment-form" class="comment-form">
      <input type="text" id="comment-input" placeholder="Écrire un commentaire..." required maxlength="1000">
      <button type="submit">Envoyer</button>
    </form>
  </section>

  <!-- Script Applicatif -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // 1. Configuration Firebase
    const firebaseConfig = {
      databaseURL: "https://ton-projet-firebase.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Flag de débogage pour purger les logs en production
    const DEBUG = false;
    function log(...args) {
      if (DEBUG) console.log(...args);
    }

    // 2. Gestion du redimensionnement fluide sans saccade
    let resizeScheduled = false;

    function updateBookScale() {
      if (resizeScheduled) return;
      resizeScheduled = true;

      requestAnimationFrame(() => {
        const wrap = document.querySelector('.book-scale-wrap');
        if (wrap) {
          const padding = 20;
          const scaleX = (window.innerWidth - padding) / 840;
          const scaleY = (window.innerHeight - padding) / 595;
          const scale = Math.min(scaleX, scaleY, 1.2);
          wrap.style.transform = `scale(${scale})`;
        }
        resizeScheduled = false;
      });
    }

    // 3. Compression & Redimensionnement d'images côté client
    function compressImage(file, maxWidth = 800, maxHeight = 800) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('canvas');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.onerror = (err) => reject(err);
        };
      });
    }

    // 4. Initialisation des événements
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.body.classList.remove('no-anim'), 100);

      updateBookScale();
      window.addEventListener('resize', updateBookScale, { passive: true });

      // Mode Artiste via URL Hash (#artist)
      if (window.location.hash.includes('artist')) {
        const artistDock = document.getElementById('artist-dock');
        if (artistDock) artistDock.classList.remove('hidden');
      }

      // Thème Sombre
      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
      });

      // Mode Accessibilité DYS
      document.getElementById('inclusive-mode-btn')?.addEventListener('click', () => {
        document.body.classList.toggle('dyslexic-mode');
      });

      // Interaction Enveloppe
      const envelope = document.getElementById('envelope-module');
      envelope?.addEventListener('click', () => {
        envelope.classList.toggle('open');
      });

      // Panneau Commentaires
      const commentsSheet = document.getElementById('comments-sheet');
      document.getElementById('open-comments-btn')?.addEventListener('click', () => {
        commentsSheet?.classList.remove('hidden');
      });
      document.getElementById('close-comments-btn')?.addEventListener('click', () => {
        commentsSheet?.classList.add('hidden');
      });

      log("Application carnet d'artiste initialisée avec succès.");
    });
  </script>
</body>
</html>
